{% extends 'base.html' %}{% block breadcrumb %}Bank accounts{% endblock %}{% block content %}
<div class="page-heading"><div><div class="eyebrow">CUSTOMER WORKSPACE</div><h1>Bank accounts</h1><p>Find an account, move money, and follow its story.</p></div><a href="{% url 'banking:create' %}" class="btn btn-primary">＋ Open account</a></div>
<section class="panel"><form method="get" class="filter-bar"><div class="search-field"><label class="visually-hidden" for="q">Search accounts</label><input id="q" name="q" value="{{ q }}" class="form-control" placeholder="Search name, email or account number"></div><div><label class="visually-hidden" for="status">Account status</label><select id="status" name="status" class="form-control"><option value="">All open accounts</option>{% for value,label in statuses %}<option value="{{ value }}" {% if status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><button class="btn btn-secondary">Filter accounts</button></form>{% include 'banking/account_table.html' %}{% include 'banking/pagination.html' %}</section>{% endblock %}
