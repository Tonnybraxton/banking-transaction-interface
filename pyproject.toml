[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["banking/tests"]
addopts = "--cov=banking --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", ".tmp", "pytest-cache-files-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
